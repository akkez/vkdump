[project]
name = "vkdump"
version = "0.1.0"
description = "Parse and enrich VK chat dumps into a local SQLite store."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "typer>=0.12",
    "rich>=13",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "aiohttp>=3.10",
]

[project.scripts]
vkdump = "vkdump.cli.main:app"
vkdump-gui = "vkdump.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vkdump"]
